name: Workflow Health Guard

# Detects and auto-remediates silently broken automation:
# - re-enables workflows GitHub disabled for 60-day repo inactivity
# - keepalive-pings scheduled workflows so the 60-day clock never expires
# - flags manually disabled or stale-scheduled workflows via a deduped issue
# - clears orphaned code-scanning tools that trigger "configuration error"
on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
      security-events: write # delete orphaned code-scanning analyses
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check workflow health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/workflow-health.js
      - name: Check code-scanning configuration health
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/code-scanning-health.js
