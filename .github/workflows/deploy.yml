name: MikeGira — Security Scan & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1. SECRET DETECTION ──────────────────────────────────────────────
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks — detect hardcoded secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. STATIC CODE ANALYSIS ──────────────────────────────────────────
  code-scan:
    name: SAST — CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Analyse both detected languages. Including `actions` (workflow files
        # are present) is what prevents the "code scanning configuration error".
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"

  # ── 3. CONFIRM VERCEL DEPLOYMENT ────────────────────────────────────
  confirm-deploy:
    name: Confirm Vercel Deployment
    needs: [secret-scan, code-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Security gate passed
        run: |
          echo "✅ Secret scan passed"
          echo "✅ CodeQL analysis passed"
          echo "🚀 Vercel auto-deployed from push to main"
          echo "🌐 Live at: https://bio-two-eta.vercel.app"
          echo "📅 $(date -u)"

      - name: Smoke test — verify site is live
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://bio-two-eta.vercel.app)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Site returned $STATUS"
            exit 1
          fi
          echo "✅ Site returning 200 OK"
