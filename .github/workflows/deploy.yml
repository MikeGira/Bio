name: MikeGira — Security Scan & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs per ref so two overlapping runs never upload CodeQL SARIF for
# the same commit concurrently. Racing uploads are what produced the benign
# "unsuccessful execution, exit code: 0" errored analyses that GitHub then
# surfaces on the security overview as "CodeQL is reporting errors".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. SECRET DETECTION ──────────────────────────────────────────────
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Run the gitleaks binary directly instead of gitleaks-action. The action
      # calls a gitleaks.io license server to classify the account as user/org;
      # when that lookup fails (transient 5xx) it falls back to *demanding* a paid
      # GITLEAKS_LICENSE even for a personal account, hard-failing the gate and
      # blocking every deploy. The binary needs no license and no external call.
      # Pinned to an exact version + SHA256 so the download is supply-chain safe.
      - name: Gitleaks — detect hardcoded secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "$tarball"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --log-opts="--all" --no-banner --redact --exit-code 1 .

  # ── 2. STATIC CODE ANALYSIS ──────────────────────────────────────────
  code-scan:
    name: SAST — CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # Analyse both detected languages. Including `actions` (workflow files
        # are present) is what prevents the "code scanning configuration error".
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  # ── 3. CONFIRM VERCEL DEPLOYMENT ────────────────────────────────────
  confirm-deploy:
    name: Confirm Vercel Deployment
    needs: [secret-scan, code-scan]
    # Production smoke test only makes sense after a push to main has deployed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Security gate passed
        run: |
          echo "✅ Secret scan passed"
          echo "✅ CodeQL analysis passed"
          echo "🚀 Vercel auto-deployed from push to main"
          echo "🌐 Live at: https://bio-two-eta.vercel.app"
          echo "📅 $(date -u)"

      - name: Smoke test — verify site is live
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://bio-two-eta.vercel.app)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Site returned $STATUS"
            exit 1
          fi
          echo "✅ Site returning 200 OK"
