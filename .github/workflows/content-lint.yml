name: Content Lint (AI tells)

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/check-ai-tells.js'
      - '.github/workflows/content-lint.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'scripts/check-ai-tells.js'
      - '.github/workflows/content-lint.yml'

permissions:
  contents: read

jobs:
  ai-tells:
    name: No em/en dashes or AI slop in HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the runner's preinstalled Node (built-in modules only, no deps to install).
      - name: Run AI-tell content check
        run: node scripts/check-ai-tells.js
