name: Phoenix AI Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'api/**'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'

jobs:
  prompt-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Run Phoenix AI prompt audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/audit-phoenix-prompt.js

  code-quality:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
      - name: Run code quality audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/audit-code-quality.js

  semgrep-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep security scan
        run: |
          semgrep scan --config p/security-audit --config p/secrets \
            --json --output semgrep.json . 2>/dev/null || true
        continue-on-error: true
      - name: Report findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FINDINGS=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('semgrep.json'))
            print(len(d.get('results', [])))
          except: print(0)
          ")
          echo "Semgrep found $FINDINGS issue(s)"
          if [ "$FINDINGS" = "0" ]; then exit 0; fi

          EXISTING=$(gh issue list --label semgrep --state open --json number -q '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Open semgrep issue already exists (#$EXISTING) — skipping"
            exit 0
          fi

          BODY=$(python3 - <<'PYEOF'
          import json
          from datetime import date
          d = json.load(open('semgrep.json'))
          results = d.get('results', [])[:20]
          lines = [f"## Semgrep Security Scan — {date.today()}\n\n{len(d.get('results',[]))} finding(s) in production code.\n"]
          for r in results:
              rule = r['check_id'].split('.')[-1]
              sev = r.get('extra', {}).get('severity', 'WARNING')
              msg = r['extra']['message']
              lines.append(f"**[{sev}] `{r['path']}:{r['start']['line']}`** — `{rule}`\n{msg}\n")
          lines.append("\n---\n*Generated by [Semgrep Security Scan](../../actions/workflows/ai-audit.yml) — Community Edition, free*")
          print('\n'.join(lines))
          PYEOF
          )

          TODAY=$(date +%F)
          echo "$BODY" | gh issue create \
            --title "Semgrep: $FINDINGS security finding(s) [$TODAY]" \
            --body-file - \
            --label semgrep
